<!DOCTYPE html>
<html>
<head>
  <title>AI Grievance Analyzer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      padding: 30px;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 12px 24px;
      font-size: 15px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #27ae60;
    }

    #summary {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      gap: 40px;
    }

    .summary-item .label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-item .value {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 4px;
    }

    .issue-card {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 16px;
      align-items: center;
      border-left: 6px solid #ccc;
    }

    .issue-card.high { border-left-color: #e74c3c; }
    .issue-card.low  { border-left-color: #2ecc71; }

    .card-item .label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-item .value {
      font-size: 15px;
      font-weight: 600;
      color: #2c3e50;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .badge.high     { background: #fdecea; color: #e74c3c; }
    .badge.low      { background: #eafaf1; color: #2ecc71; }
    .badge.negative { background: #fdecea; color: #e74c3c; }
    .badge.positive { background: #eafaf1; color: #2ecc71; }

    .dept-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .dept-tag {
      background: #eaf0fb;
      color: #2980b9;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    #no-issues {
      background: #eafaf1;
      color: #27ae60;
      padding: 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<h2>🎓 AI Grievance Analyzer</h2>

<div class="input-row">
  <input id="complaint" placeholder="Type your complaint here...">
  <button onclick="analyze()">Analyze</button>
</div>

<div id="result"></div>

<script>
async function analyze() {

  const text = document.getElementById("complaint").value;

  if (!text) {
    document.getElementById("result").innerHTML =
      "<p style='color:red'>Please enter a complaint</p>";
    return;
  }

  document.getElementById("result").innerHTML =
    "<p style='color:gray'>⏳ Analyzing...</p>";

  try {

    const response = await fetch("http://localhost:5000/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    // ---- Summary ----
    let html = `
      <div id="summary">
        <div class="summary-item">
          <div class="label">Total Issues</div>
          <div class="value">${data.total_issues}</div>
        </div>
        <div class="summary-item">
          <div class="label">Overall Priority</div>
          <div class="value">
            <span class="badge ${data.overall_priority.toLowerCase()}">
              ${data.overall_priority}
            </span>
          </div>
        </div>
        <div class="summary-item">
          <div class="label">Departments to Notify</div>
          <div class="dept-tags">
            ${data.departments_to_notify.length > 0
              ? data.departments_to_notify
                  .map(d => `<span class="dept-tag">${d}</span>`)
                  .join("")
              : "<span style='color:#aaa'>None</span>"
            }
          </div>
        </div>
      </div>
    `;

    // ---- Issue cards ----
    if (data.issues.length === 0) {
      html += `<div id="no-issues">✅ No complaints detected.</div>`;
    } else {
      data.issues.forEach((item, index) => {
        html += `
          <div class="issue-card ${item.priority.toLowerCase()}">
            <div class="card-item">
              <div class="label">Issue ${index + 1}</div>
              <div class="value">${item.issue}</div>
            </div>
            <div class="card-item">
              <div class="label">Category</div>
              <div class="value">${item.category}</div>
            </div>
            <div class="card-item">
              <div class="label">Sentiment</div>
              <div class="value">
                <span class="badge ${item.sentiment.toLowerCase()}">
                  ${item.sentiment}
                </span>
              </div>
            </div>
            <div class="card-item">
              <div class="label">Priority</div>
              <div class="value">
                <span class="badge ${item.priority.toLowerCase()}">
                  ${item.priority}
                </span>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById("result").innerHTML = html;

  } catch (error) {
    console.log(error);
    document.getElementById("result").innerHTML =
      "<p style='color:red'>❌ Error connecting to backend</p>";
  }

}
</script>

</body>
</html>
